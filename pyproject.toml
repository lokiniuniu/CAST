[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-matrix"
version = "0.1.0"
description = "CAST source components for Matrix-Game 3.0"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "torch",
  "torchvision",
  "triton",
  "imageio",
]

[tool.setuptools.packages.find]
where = ["src"]
